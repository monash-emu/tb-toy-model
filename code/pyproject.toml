[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tbtoy"
version = "0.1.0"
description = "Simplified TB transmission model (toy version) built on summer2 / estival"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "matplotlib",
    "numpy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tbtoy*"]
